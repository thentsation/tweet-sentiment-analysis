name: Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem no ECR (vazio = mais recente publicada)"
        type: string
        required: false
      sample:
        description: "Tamanho da amostra (--sample)"
        type: string
        default: "500"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::533267281147:role/github-actions-deploy
  ECR_REPOSITORY: tweet-sentiment-analysis
  CONTAINER_NAME: tweet-sentiment-analysis-run

jobs:
  run:
    name: Rodar o pipeline na EC2 (job em lote)
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver a tag da imagem
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text)
          fi
          [ "$TAG" != "None" ] && [ -n "$TAG" ] || { echo "Nenhuma imagem encontrada no ECR"; exit 1; }
          echo "Usando tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Achar a instância EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=free-tier-ec2" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "Instância não encontrada ou não está running"; exit 1; }
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Rodar via SSM
        run: |
          ECR_URI="533267281147.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY"
          SAMPLE="${{ inputs.sample }}"

          cat > /tmp/ssm-params.json <<JSON
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ECR_URI%/*}",
              "docker pull $ECR_URI:$TAG",
              "docker rm -f $CONTAINER_NAME 2>/dev/null || true",
              "docker run --name $CONTAINER_NAME --rm $ECR_URI:$TAG --sample $SAMPLE",
              "docker image prune -f"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Run $ECR_REPOSITORY:$TAG (manual)" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "Aguardando comando $COMMAND_ID na instância $INSTANCE_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
            if [ "$i" = "60" ]; then
              echo "Timeout esperando o comando terminar"
              exit 1
            fi
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
